<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aplikasi katalog cerita berbasis lokasi dengan peta interaktif dari Dicoding" />
    <meta name="theme-color" content="#87CEEB" />
    <title>Katalog Cerita Dicoding</title>

    <link rel="manifest" href="/manifest.json" />
    
    <link rel="apple-touch-icon" href="/images/icon-192x192.png" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DicodingStory" />

    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-192x192.png" />

    <script>
      function skipToContent() {
        const main = document.getElementById('main-content');
        main.focus();
      }
    </script>
  </head>

  <body>
    <a href="#main-content" class="skip-link" onclick="skipToContent(); return false;">Lewati ke konten utama</a>

    <!-- HEADER -->
    <header role="banner" class="main-header">
      <div class="container header-container">
        <a href="#/" class="brand-name" aria-label="Halaman utama Katalog Cerita">
          Katalog Cerita
        </a>

        <nav id="navigation-drawer" class="navigation-drawer" role="navigation" aria-label="Navigasi utama">
          <ul class="nav-list">
            <li><a href="#/">Beranda</a></li>
            <li><a href="#/add">Tambah Cerita</a></li>
            <li><a href="#/favorites">Favorit Saya</a></li>
            <li><a href="#/about">Tentang</a></li>
            <li><a href="#/login" id="authLink">Login</a></li>
          </ul>
        </nav>

        <button id="drawer-button" class="drawer-button" aria-label="Buka menu navigasi" aria-controls="navigation-drawer" aria-expanded="false">☰</button>
      </div>
    </header>

    <section id="notification-toggle-container" style="text-align:center;margin:1rem 0;"></section>

    <main id="main-content" class="main-content" tabindex="-1" role="main" aria-live="polite"></main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <footer role="contentinfo" class="footer">
      <p>&copy; 2025 Katalog Cerita Dicoding | PWA by I Made Gede Riyandhi Wiguna Putra</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="/scripts/index.js"></script>

    <script>

      document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const authLink = document.getElementById('authLink');

        if (token) {
          authLink.textContent = 'Logout';
          authLink.href = '#/';
          authLink.setAttribute('aria-label', 'Keluar dari akun');
          authLink.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            localStorage.removeItem('push-enabled');
            alert('Anda telah logout!');
            window.location.hash = '/login';
            window.location.reload();
          });
        } else {
          authLink.textContent = 'Login';
          authLink.href = '#/login';
          authLink.setAttribute('aria-label', 'Masuk ke akun');
        }
      });
    </script>

    <noscript>
      <div style="text-align: center; padding: 2rem;">
        <p>Aplikasi ini memerlukan JavaScript untuk berjalan. Silakan aktifkan JavaScript di browser Anda.</p>
      </div>
    </noscript>
  </body>
</html>
